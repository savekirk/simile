name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  browser:
    name: portable browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and browser runner
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Check portable dependencies
        run: bash scripts/check-portable.sh
      - name: Test in Chrome
        run: bash scripts/test-browser.sh
      - name: Test TypeScript Worker API
        run: bash scripts/test-worker.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current stable Rust for audit tooling
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: rustup run stable cargo install cargo-deny --locked
      - name: Audit dependencies
        run: cargo deny check
