[workspace]
members = ["cargo:crates/simile-cli"]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
pr-run-mode = "plan"
hosting = "github"
install-updater = false
github-attestations = true
install-path = "CARGO_HOME"

# GitHub retired the macos-14 ARM runner that dist 0.32 selects by default. Pinning the current
# standard ARM runner keeps Apple Silicon artifacts—and therefore the universal shell
# installer—publishable without hand-editing the generated workflow.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
