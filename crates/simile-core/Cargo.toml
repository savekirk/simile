[package]
name = "simile-core"
description = "Application operations and domain types for Simile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["native", "smithy"]
native = ["dep:ureq", "simile-service/persistence", "simile-stack/persistence"]
smithy = ["simile-compiler/smithy"]

[dependencies]
rand.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
simile-artifact.workspace = true
simile-compiler.workspace = true
simile-heuristics.workspace = true
simile-hcl.workspace = true
simile-runtime.workspace = true
simile-service.workspace = true
simile-spec.workspace = true
simile-stack.workspace = true
simile-typescript.workspace = true
thiserror.workspace = true
time.workspace = true
ureq = { workspace = true, optional = true }

[lints]
workspace = true
