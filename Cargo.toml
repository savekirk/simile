[workspace]
members = [
    "crates/simile-artifact",
    "crates/simile-cli",
    "crates/simile-compiler",
    "crates/simile-core",
    "crates/simile-hcl",
    "crates/simile-heuristics",
    "crates/simile-learning",
    "crates/simile-openapi",
    "crates/simile-runtime",
    "crates/simile-schema",
    "crates/simile-server",
    "crates/simile-service",
    "crates/simile-smithy",
    "crates/simile-spec",
    "crates/simile-stack",
    "crates/simile-typescript",
    "crates/simile-wasm",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Inttegro"]
repository = "https://github.com/inttegro/simile"

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
axum = "0.8.9"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
form_urlencoded = "1.2.2"
fs2 = "0.4.3"
hcl-rs = "0.20.0"
rand = "0.9.2"
rand_regex = "0.18.1"
redb = "=2.6.4"
regress = "=0.10.4"
oxc_allocator = "0.75.0"
oxc_ast = "0.75.0"
oxc_parser = "0.75.0"
oxc_span = "0.75.0"
percent-encoding = "2.3.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
sha2 = "0.10.9"
simile-artifact = { version = "=0.4.0", path = "crates/simile-artifact" }
simile-compiler = { version = "=0.4.0", path = "crates/simile-compiler", default-features = false }
simile-core = { version = "=0.4.0", path = "crates/simile-core", default-features = false }
simile-hcl = { version = "=0.4.0", path = "crates/simile-hcl" }
simile-heuristics = { version = "=0.4.0", path = "crates/simile-heuristics" }
simile-learning = { version = "=0.4.0", path = "crates/simile-learning" }
simile-openapi = { version = "=0.4.0", path = "crates/simile-openapi" }
simile-runtime = { version = "=0.4.0", path = "crates/simile-runtime" }
simile-schema = { version = "=0.4.0", path = "crates/simile-schema" }
simile-server = { version = "=0.4.0", path = "crates/simile-server" }
simile-service = { version = "=0.4.0", path = "crates/simile-service", default-features = false }
simile-smithy = { version = "=0.4.0", path = "crates/simile-smithy" }
simile-spec = { version = "=0.4.0", path = "crates/simile-spec" }
simile-stack = { version = "=0.4.0", path = "crates/simile-stack", default-features = false }
simile-typescript = { version = "=0.4.0", path = "crates/simile-typescript" }
snapbox = { version = "1.2.2", features = ["cmd"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tree-sitter = "0.20.10"
tree-sitter-smithy = "0.0.1"
ureq = "3.5.2"
web-time = "=1.1.0"
wasm-bindgen = "=0.2.100"
wasm-bindgen-test = "=0.3.50"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
